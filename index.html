<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lily &amp; Lulu — Name Checker</title>
  <style>
    :root {
      --ink:    #26221f;
      --muted:  #9a908a;
      --faint:  #c9beb7;
      --line:   #ece7e3;
      --avail:  #1f7a46;
      --taken:  #b9aca4;
      --accent: #c0552f;
      --bg:     #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .wrap {
      max-width: 620px;
      margin: 0 auto;
      padding: 64px 24px 96px;
    }

    .brand {
      font-size: 0.8rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 30px;
    }

    /* ── Search: single line ── */
    .search {
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--ink);
      padding: 10px 2px;
    }
    .search svg { flex-shrink: 0; stroke: var(--muted); }
    .search input {
      border: none;
      outline: none;
      background: transparent;
      font-family: inherit;
      font-size: 1.25rem;
      color: var(--ink);
      width: 100%;
      padding: 2px 0;
    }
    .search input::placeholder { color: var(--faint); }

    .hint { font-size: 0.8rem; color: var(--faint); margin-top: 10px; }

    /* ── Results ── */
    #list { margin-top: 44px; }

    .item {
      padding: 20px 0;
      border-bottom: 1px solid var(--line);
      position: relative;
      transition: background 0.12s;
    }
    .item:first-child { border-top: 1px solid var(--line); }
    .item:hover { background: #faf8f6; }

    .headline {
      font-size: 1.15rem;
      color: var(--ink);
      letter-spacing: -0.01em;
    }
    .headline .dom { font-weight: 600; }
    .verdict { font-weight: 400; }
    .verdict.avail { color: var(--avail); }
    .verdict.taken { color: var(--taken); }
    .verdict.unk   { color: var(--muted); }
    .verdict.chk   { color: var(--muted); font-style: italic; }

    .exts {
      margin-top: 7px;
      font-size: 0.92rem;
      color: var(--muted);
    }
    .ext { white-space: nowrap; }
    .ext.yes { color: var(--avail); }
    .ext.no  { color: var(--taken); text-decoration: line-through; }
    .ext.unk { color: var(--muted); }
    .exts .sep { color: var(--faint); margin: 0 7px; }

    .fit {
      margin-top: 8px;
      font-size: 0.78rem;
      color: var(--faint);
      letter-spacing: 0.02em;
    }
    .fit b { font-weight: 600; color: var(--muted); }

    .del {
      position: absolute;
      top: 20px; right: 0;
      background: none; border: none; cursor: pointer;
      color: var(--faint); font-size: 1rem; line-height: 1;
      opacity: 0; transition: opacity 0.15s, color 0.15s;
    }
    .item:hover .del { opacity: 1; }
    .del:hover { color: var(--accent); }

    .empty { margin-top: 60px; text-align: center; color: var(--faint); font-size: 1rem; }

    #toast {
      position: fixed; bottom: 28px; left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--ink); color: #fff; padding: 10px 22px;
      border-radius: 30px; font-size: 0.9rem;
      transition: transform 0.3s ease; pointer-events: none; z-index: 99;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<div class="wrap">
  <div class="brand">Lily &amp; Lulu · Name Checker</div>

  <div class="search">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="text" id="name-input" autocomplete="off"
           placeholder="Search a name…"
           onkeydown="if(event.key==='Enter')runSearch()" />
  </div>
  <p class="hint">Press Enter to check .com · .net · .org · .co · .pet. Commas check several at once.</p>

  <div id="list"></div>
</div>

<div id="toast"></div>

<script>
  const API_URL = 'https://script.google.com/macros/s/AKfycbyCitDPQfwwT689IDhRvQuoaEsK7-7O1ZEuYhhvZBRPCf76dpbq54Ad0LQ54Vk7-158/exec';

  let items = [];
  const pending = new Set();

  window.addEventListener('DOMContentLoaded', loadItems);

  function loadItems() {
    fetch(API_URL)
      .then(function(r){ return r.json(); })
      .then(function(data){
        items = data.ok ? (data.thoughts || []).filter(function(t){ return t.cat === '🌐 Domain Names'; }) : [];
        render();
      })
      .catch(render);
  }

  function runSearch() {
    var input = document.getElementById('name-input');
    var raw = input.value.trim();
    if (!raw) { input.focus(); return; }
    var names = raw.split(/[,\n]/).map(function(n){ return n.trim(); }).filter(Boolean);
    input.value = '';

    var nowDate = new Date().toLocaleDateString('en-US', { weekday:'short', year:'numeric', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });

    names.forEach(function(name){
      var id = String(Date.now() + Math.random());
      items.unshift({ id:id, text:name, date:nowDate, availability:'' });
      pending.add(name.toLowerCase());
      fetch(API_URL, { method:'POST', body: JSON.stringify({ action:'add', id:id, cat:'🌐 Domain Names', text:name, date:nowDate }), headers:{ 'Content-Type':'text/plain' }, mode:'no-cors' });
    });
    render();
    showToast(names.length > 1 ? 'Checking ' + names.length + ' names…' : 'Checking availability…');
    poll(0);
  }

  function poll(tries) {
    if (pending.size === 0 || tries > 6) return;
    setTimeout(function(){
      fetch(API_URL).then(function(r){ return r.json(); }).then(function(data){
        if (data.ok) {
          (data.thoughts || []).filter(function(t){ return t.cat === '🌐 Domain Names'; }).forEach(function(f){
            var key = String(f.text || '').toLowerCase();
            if (f.availability && pending.has(key)) {
              var mine = items.find(function(m){ return m.text.toLowerCase() === key && !m.availability; });
              if (mine) { mine.availability = f.availability; mine.id = f.id; }
              pending.delete(key);
            }
          });
          render();
        }
        poll(tries + 1);
      }).catch(function(){ poll(tries + 1); });
    }, 2600);
  }

  function removeItem(id) {
    fetch(API_URL, { method:'POST', body: JSON.stringify({ action:'delete', id:id }), headers:{ 'Content-Type':'text/plain' }, mode:'no-cors' });
    items = items.filter(function(t){ return t.id !== id; });
    render();
  }

  // Parse availability string into [{tld, status}]
  function parseAvail(avail) {
    if (!avail) return null;
    return avail.split('|').map(function(p){
      p = p.trim(); if (!p) return null;
      var isAvail = p.indexOf('✅') !== -1 || (/AVAILABLE/i.test(p) && !/POSSIBLY/i.test(p));
      var isTaken = p.indexOf('❌') !== -1 || /TAKEN/i.test(p);
      var status = isAvail ? 'yes' : (isTaken ? 'no' : 'unk');
      var domain = p.replace(/✅|❌|⚠️/g,'').replace(/^[A-Z][^:]*:\s*/i,'').trim();
      var dot = domain.indexOf('.');
      return { tld: dot !== -1 ? domain.slice(dot) : domain, status: status };
    }).filter(Boolean);
  }

  function render() {
    var box = document.getElementById('list');
    if (!items.length) { box.innerHTML = '<div class="empty">No names checked yet.</div>'; return; }

    box.innerHTML = items.map(function(t){
      var base = esc(String(t.text).trim().split(/\s+/)[0].replace(/\..*$/, ''));
      var parsed = parseAvail(t.availability);
      var headline, exts = '';

      if (!parsed) {
        headline = '<span class="dom">' + base + '.com</span> <span class="verdict chk">checking…</span>';
      } else {
        // headline anchored on .com if present, else first entry
        var primary = parsed.find(function(e){ return e.tld === '.com'; }) || parsed[0];
        var word = primary.status === 'yes' ? 'is available' : (primary.status === 'no' ? 'is taken' : 'status unknown');
        headline = '<span class="dom">' + base + primary.tld + '</span> <span class="verdict ' + primary.status + '">' + word + '</span>';

        var others = parsed.filter(function(e){ return e !== primary; });
        if (others.length) {
          exts = '<div class="exts">' + others.map(function(e){
            return '<span class="ext ' + e.status + '">' + esc(e.tld) + '</span>';
          }).join('<span class="sep">·</span>') + '</div>';
        }
      }

      var fit = brandFit(base);
      var fitLine = '<div class="fit">community <b class="' + fit.community.cls + '" title="' + esc(fit.community.why) + '">' + fit.community.label.toLowerCase() +
        '</b> &nbsp;·&nbsp; all pets <b class="' + fit.allpets.cls + '" title="' + esc(fit.allpets.why) + '">' + fit.allpets.label.toLowerCase() + '</b></div>';

      return '<div class="item">' +
        '<div class="headline">' + headline + '</div>' +
        exts + fitLine +
        '<button class="del" title="Remove" onclick="removeItem(\'' + t.id + '\')">✕</button>' +
      '</div>';
    }).join('');
  }

  // ── Brand-fit heuristic ──
  function brandFit(name) {
    var n = String(name).toLowerCase();
    var communityWords = ['club','hub','circle','pack','community','commune','neighbour','neighbor','hood','parish','village','town','local','together','friend','family','fam','meet','share','social','society','guild','collective','coop','co-op','corner','porch','fireside','gather','den','nest','crew','squad','tribe','kin','buddy','buddies','mate','pal','connect','network','commons','lounge','cafe','campfire','world','folk','people'];
    var genericPet   = ['pet','pets','critter','creature','animal','companion','fur','furry','paw','tail','ark','menagerie','zoo','beast','buddy','friend'];
    var speciesWords = ['dog','doggo','doggy','pup','puppy','pooch','woof','bark','hound','canine','k9','cat','kitty','kitten','meow','purr','feline','mog','moggy','bird','avian','tweet','fish','hen','chick','chicken','cluck','goat','bunny','rabbit','hare','hamster','horse','pony','reptile','turtle','snake','moo','moos','cow'];
    function which(list){ return list.filter(function(w){ return n.indexOf(w) !== -1; }); }

    var comm, cHits = which(communityWords), hasAnd = n.indexOf('and') !== -1 || n.indexOf('&') !== -1;
    if (cHits.length) comm = { cls:'strong', label:'Strong', why:'Contains a belonging cue ("' + cHits[0] + '") that signals a shared community.' };
    else if (hasAnd || n.length <= 9) comm = { cls:'fair', label:'Fair', why:'Warm and approachable, but nothing explicitly signals a community.' };
    else comm = { cls:'weak', label:'Weak', why:'Reads as a standalone brand; no obvious cue of togetherness.' };

    var pets, sHits = which(speciesWords), gHits = which(genericPet);
    if (sHits.length) pets = { cls:'weak', label:'Weak', why:'Leans toward one animal ("' + sHits[0] + '"), narrowing the all-species promise.' };
    else if (gHits.length) pets = { cls:'strong', label:'Strong', why:'Uses a species-neutral term ("' + gHits[0] + '") — welcoming to every pet.' };
    else pets = { cls:'fair', label:'Fair', why:'Neutral / invented name with no species baggage — open to all pets.' };

    return { community: comm, allpets: pets };
  }

  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
  function showToast(msg){ var t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(function(){ t.classList.remove('show'); }, 2200); }
</script>
</body>
</html>
